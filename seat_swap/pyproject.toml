[project]
name = "seat-swap"
version = "0.1.0"
description = "Q1.2 sprint code: does a cartel re-form after one seller is replaced?"
requires-python = ">=3.10"
dependencies = [
    "llm-cartel",
    "poseidon-compute",
    "numpy>=1.26",
    "scipy>=1.11",
    "openai>=1.86.0",
    "python-dotenv>=1.0",
    "transformers>=4.51",
    "pytest>=8",
    "jinja2>=3.1",
    "modal>=1.6.2",
    "openai-harmony>=0.0.8",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-cartel = { path = "../llm-cartel", editable = true }
poseidon-compute = { path = "../util", editable = true }

[dependency-groups]
dev = []
